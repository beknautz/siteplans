; BaceBuilt Site Plan Tool - PHP overrides
; This file is read automatically by PHP on shared hosting (no php.ini access needed).
; Place this in the web root alongside index.php.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Session: use the system temp directory (writable on Windows shared hosts)
session.save_handler = files
session.save_path = ""

; Increase limits for map/GeoJSON data
post_max_size = 16M
upload_max_filesize = 16M
max_execution_time = 60
memory_limit = 128M
